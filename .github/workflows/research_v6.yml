name: Research V6 conditional sensor shift

on:
  push:
    branches: [research-v6-sensor-reliability-shift]
    paths:
      - 'research_v6/**'
      - '.github/workflows/research_v6.yml'
  workflow_dispatch:

jobs:
  sensor-shift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout isolated Research V6
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run eight verification tests
        run: |
          python -m unittest discover -s research_v6/tests -v
      - name: Execute controlled reliability-shift study
        run: |
          python research_v6/sensor_shift_experiment.py
      - name: Assert empirical and analytical pre-registered predictions
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('research_v6/outputs/trial_results.csv')
          a=pd.read_csv('research_v6/outputs/exact_bayes_reference.csv')
          p=pd.read_csv('research_v6/outputs/paired_comparisons.csv')
          assert len(d)==2160 and len(a)==6 and len(p)==54
          q=a.loc[a.q_test==.3,'improvement_bits'].iloc[0]
          r=a.loc[a.q_test==.5,'improvement_bits'].iloc[0]
          assert q>.07 and r<-.08
          cases=p[(p.n==1000)&(p.method=='Greedy CMI')&(p.baseline=='Marginal MI')]
          pos=cases.loc[cases.q_test==.3,'logloss_gain_bits'].iloc[0]
          neg=cases.loc[cases.q_test==.5,'logloss_gain_bits'].iloc[0]
          assert pos>.06 and neg<-.06
          print('Verified exact theory, sign reversal and total evaluations')
          PY
      - name: Upload reproducible research files and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: information-theory-research-v6-complete
          path: |
            research_v6/
            requirements.txt
          if-no-files-found: warn
